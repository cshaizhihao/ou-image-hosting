name: Release images

on:
  push:
    tags:
      - v[0-9]*

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish version and commit images
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.component }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}-${{ matrix.component }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=ou-image-hosting
          cache-to: type=gha,mode=max,scope=ou-image-hosting
      - name: Record deployed image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.component }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" > image-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.component }}
          path: image-digest.txt
